# Description des services de l'API, affichée par Swagger sur /apidocs.
# Chaque nouveau service est ajouté ici, sous « paths ».
swagger: "2.0"
info:
  title: Similis
  description: API de la galerie de photos et de la recherche d'images par le contenu.
  version: "1.0"
basePath: /api
tags:
  - name: Système
  - name: Authentification
    description: Session par cookie. Tous les autres services exigent d'être connecté.
  - name: Catégories
    description: Hiérarchie libre, propre à chaque utilisateur.
  - name: Images
    description: Images de la galerie. L'image d'un autre utilisateur répond 404.
  - name: Transformations
    description: Chaque transformation crée une nouvelle image avec ses propres dimensions.
  - name: Descripteurs
    description: Vecteur de 141 valeurs par image (couleur et texture), calculé au chargement.
  - name: GHIM-10K
    description: Base partagée de 10 000 images, en lecture seule. L'id d'une image est sa position dans l'index.
  - name: Recherche
    description: Recherche par le contenu dans GHIM-10K et la galerie de l'utilisateur.
definitions:
  Designation:
    type: object
    required: [source, id]
    properties:
      source:
        type: string
        enum: [galerie, ghim]
      id:
        type: integer
        example: 4012
  Resultat:
    type: object
    properties:
      source:
        type: string
        enum: [galerie, ghim]
      id:
        type: integer
        example: 4012
      nom:
        type: string
        example: 5_2504.jpg
      categorie:
        type: string
        x-nullable: true
        description: dossier de GHIM-10K, ou catégorie de la galerie (nul si l'image n'en a pas)
        example: mountains
      distance:
        type: number
        example: 0.4127
  Descripteurs:
    type: object
    properties:
      source:
        type: string
        example: galerie
      id:
        type: integer
        example: 7
      histogrammes:
        type: object
        description: R, G, B, 32 cases chacun, en fréquences (somme 1)
        properties:
          r:
            type: array
            items:
              type: number
          g:
            type: array
            items:
              type: number
          b:
            type: array
            items:
              type: number
      moments:
        type: object
        description: En HSV, canaux entre 0 et 1. Pour chaque canal, moyenne, écart-type, asymétrie.
        properties:
          h:
            type: array
            items:
              type: number
            example: [0.52, 0.21, -0.08]
          s:
            type: array
            items:
              type: number
          v:
            type: array
            items:
              type: number
      dominantes:
        type: array
        description: 5 couleurs (k-means), de la plus présente à la moins présente
        items:
          type: object
          properties:
            r:
              type: number
              example: 0.12
            g:
              type: number
              example: 0.45
            b:
              type: number
              example: 0.8
            proportion:
              type: number
              example: 0.37
      glcm:
        type: object
        description: Moyenne des directions 0, 45, 90 et 135 degrés, distance 1
        properties:
          contraste:
            type: number
          correlation:
            type: number
          energie:
            type: number
          homogeneite:
            type: number
          dissimilarite:
            type: number
          asm:
            type: number
      lbp:
        type: array
        description: Histogramme des 10 motifs uniformes (8 voisins, rayon 1), en fréquences
        items:
          type: number
  Categorie:
    type: object
    properties:
      id:
        type: integer
        example: 3
      parent_id:
        type: integer
        x-nullable: true
        description: nul pour une catégorie racine
        example: 1
      nom:
        type: string
        example: Maroc
      nb_images:
        type: integer
        example: 12
  Image:
    type: object
    properties:
      id:
        type: integer
        example: 7
      categorie_id:
        type: integer
        x-nullable: true
        description: nul pour une image sans catégorie
        example: 3
      nom:
        type: string
        example: plage.jpg
      largeur:
        type: integer
        example: 400
      hauteur:
        type: integer
        example: 300
      cree_le:
        type: string
        example: "2026-11-11 16:00:00"
  Ids:
    type: object
    required: [ids]
    properties:
      ids:
        type: array
        items:
          type: integer
        example: [7, 8]
  Identifiants:
    type: object
    required: [nom, mot_de_passe]
    properties:
      nom:
        type: string
        description: 3 à 30 caractères, unique
        example: Amine
      mot_de_passe:
        type: string
        description: 8 caractères minimum
        example: motdepasse1
  Utilisateur:
    type: object
    properties:
      id:
        type: integer
        example: 1
      nom:
        type: string
        example: Amine
  Erreur:
    type: object
    properties:
      erreur:
        type: string
        example: Connexion requise.
paths:
  /auth/inscription:
    post:
      tags: [Authentification]
      summary: Crée un compte et ouvre la session
      parameters:
        - in: body
          name: corps
          required: true
          schema:
            $ref: "#/definitions/Identifiants"
      responses:
        201:
          description: Compte créé
          schema:
            $ref: "#/definitions/Utilisateur"
        400:
          description: Nom ou mot de passe invalide
          schema:
            $ref: "#/definitions/Erreur"
        409:
          description: Nom déjà utilisé
          schema:
            $ref: "#/definitions/Erreur"
  /auth/connexion:
    post:
      tags: [Authentification]
      summary: Ouvre la session
      parameters:
        - in: body
          name: corps
          required: true
          schema:
            $ref: "#/definitions/Identifiants"
      responses:
        200:
          description: Connecté
          schema:
            $ref: "#/definitions/Utilisateur"
        401:
          description: Nom ou mot de passe incorrect
          schema:
            $ref: "#/definitions/Erreur"
  /auth/deconnexion:
    post:
      tags: [Authentification]
      summary: Ferme la session
      responses:
        204:
          description: Déconnecté
  /auth/moi:
    get:
      tags: [Authentification]
      summary: Renvoie l'utilisateur connecté
      responses:
        200:
          description: Utilisateur connecté
          schema:
            $ref: "#/definitions/Utilisateur"
        401:
          description: Pas de session
          schema:
            $ref: "#/definitions/Erreur"
  /sante:
    get:
      tags: [Système]
      summary: Vérifie que l'API répond
      responses:
        200:
          description: L'API fonctionne
          schema:
            type: object
            properties:
              etat:
                type: string
                example: ok
              application:
                type: string
                example: Similis
  /categories:
    get:
      tags: [Catégories]
      summary: Liste à plat des catégories (l'arbre est construit par le frontend)
      responses:
        200:
          description: Catégories de l'utilisateur
          schema:
            type: array
            items:
              $ref: "#/definitions/Categorie"
    post:
      tags: [Catégories]
      summary: Crée une catégorie
      parameters:
        - in: body
          name: corps
          required: true
          schema:
            type: object
            required: [nom]
            properties:
              nom:
                type: string
                description: 1 à 50 caractères
                example: Maroc
              parent_id:
                type: integer
                x-nullable: true
                description: absent ou nul pour créer à la racine
                example: 1
      responses:
        201:
          description: Catégorie créée
          schema:
            $ref: "#/definitions/Categorie"
        400:
          description: Nom invalide
          schema:
            $ref: "#/definitions/Erreur"
        404:
          description: Catégorie parente introuvable
          schema:
            $ref: "#/definitions/Erreur"
        409:
          description: Nom déjà utilisé sous ce parent
          schema:
            $ref: "#/definitions/Erreur"
  /categories/{id}:
    parameters:
      - in: path
        name: id
        type: integer
        required: true
    put:
      tags: [Catégories]
      summary: Renomme une catégorie
      parameters:
        - in: body
          name: corps
          required: true
          schema:
            type: object
            required: [nom]
            properties:
              nom:
                type: string
                example: Maroc 2026
      responses:
        200:
          description: Catégorie renommée
          schema:
            $ref: "#/definitions/Categorie"
        400:
          description: Nom invalide
          schema:
            $ref: "#/definitions/Erreur"
        404:
          description: Catégorie introuvable
          schema:
            $ref: "#/definitions/Erreur"
        409:
          description: Nom déjà utilisé sous ce parent
          schema:
            $ref: "#/definitions/Erreur"
    delete:
      tags: [Catégories]
      summary: Supprime une catégorie vide
      responses:
        204:
          description: Catégorie supprimée
        404:
          description: Catégorie introuvable
          schema:
            $ref: "#/definitions/Erreur"
        409:
          description: La catégorie contient des images ou des sous-catégories
          schema:
            $ref: "#/definitions/Erreur"
  /images:
    get:
      tags: [Images]
      summary: Liste les images d'une catégorie
      parameters:
        - in: query
          name: categorie_id
          type: integer
          description: sans ce paramètre, les images sans catégorie
      responses:
        200:
          description: Images, la plus récente en premier
          schema:
            type: array
            items:
              $ref: "#/definitions/Image"
        404:
          description: Catégorie introuvable
          schema:
            $ref: "#/definitions/Erreur"
    post:
      tags: [Images]
      summary: Charge une ou plusieurs images (JPG ou PNG, 10 Mo maximum par fichier)
      consumes: [multipart/form-data]
      parameters:
        - in: formData
          name: fichiers
          type: file
          required: true
          description: champ répété, un par fichier
        - in: formData
          name: categorie_id
          type: integer
          description: absent pour charger sans catégorie
      responses:
        201:
          description: Au moins une image enregistrée ; les fichiers refusés sont listés
          schema:
            type: object
            properties:
              creees:
                type: array
                items:
                  $ref: "#/definitions/Image"
              refusees:
                type: array
                items:
                  type: object
                  properties:
                    nom:
                      type: string
                      example: notes.txt
                    raison:
                      type: string
                      example: Format non accepté (JPG ou PNG seulement).
        400:
          description: Aucun fichier envoyé, ou aucun fichier accepté
          schema:
            $ref: "#/definitions/Erreur"
        404:
          description: Catégorie introuvable
          schema:
            $ref: "#/definitions/Erreur"
        413:
          description: Envoi de plus de 200 Mo au total
          schema:
            $ref: "#/definitions/Erreur"
  /images/{id}:
    parameters:
      - in: path
        name: id
        type: integer
        required: true
    get:
      tags: [Images]
      summary: Renvoie une image (nom, catégorie, dimensions)
      responses:
        200:
          description: L'image
          schema:
            $ref: "#/definitions/Image"
        404:
          description: Image introuvable
          schema:
            $ref: "#/definitions/Erreur"
    put:
      tags: [Images]
      summary: Déplace une image vers une catégorie
      parameters:
        - in: body
          name: corps
          required: true
          schema:
            type: object
            required: [categorie_id]
            properties:
              categorie_id:
                type: integer
                x-nullable: true
                description: nul pour « sans catégorie »
                example: 3
      responses:
        200:
          description: Image déplacée
          schema:
            $ref: "#/definitions/Image"
        400:
          description: Champ categorie_id absent
          schema:
            $ref: "#/definitions/Erreur"
        404:
          description: Image ou catégorie introuvable
          schema:
            $ref: "#/definitions/Erreur"
    delete:
      tags: [Images]
      summary: Supprime une image (ligne en base et fichier)
      responses:
        204:
          description: Image supprimée
        404:
          description: Image introuvable
          schema:
            $ref: "#/definitions/Erreur"
  /images/{id}/fichier:
    get:
      tags: [Images]
      summary: Renvoie le fichier d'une image
      produces: [image/jpeg, image/png]
      parameters:
        - in: path
          name: id
          type: integer
          required: true
        - in: query
          name: telecharger
          type: integer
          description: présent (par exemple 1), le fichier est renvoyé en pièce jointe
      responses:
        200:
          description: Le fichier
          schema:
            type: file
        404:
          description: Image introuvable
          schema:
            $ref: "#/definitions/Erreur"
  /images/{id}/transformations:
    post:
      tags: [Transformations]
      summary: Crée une nouvelle image par transformation (l'originale est conservée)
      description: |
        Paramètres selon le type :
        - recadrage : x, y, largeur, hauteur (entiers, zone entièrement dans l'image)
        - echelle : facteur (entre 0,1 et 4)
        - rotation : angle (90, 180 ou 270, sens des aiguilles d'une montre)
        - miroir : axe autour duquel l'image se retourne (horizontal : haut et bas échangés ; vertical : gauche et droite échangées)
        - gris : aucun paramètre
      parameters:
        - in: path
          name: id
          type: integer
          required: true
        - in: body
          name: corps
          required: true
          schema:
            type: object
            required: [type]
            properties:
              type:
                type: string
                enum: [recadrage, echelle, rotation, miroir, gris]
                example: recadrage
              x:
                type: integer
                example: 10
              y:
                type: integer
                example: 20
              largeur:
                type: integer
                example: 200
              hauteur:
                type: integer
                example: 150
              facteur:
                type: number
                example: 0.5
              angle:
                type: integer
                enum: [90, 180, 270]
              axe:
                type: string
                enum: [horizontal, vertical]
      responses:
        201:
          description: Nouvelle image, dans la même catégorie, nommée d'après le type et son paramètre (plage_miroir_H.jpg, plage_echelle_0.5.jpg)
          schema:
            $ref: "#/definitions/Image"
        400:
          description: Type inconnu ou paramètre invalide
          schema:
            $ref: "#/definitions/Erreur"
        404:
          description: Image introuvable
          schema:
            $ref: "#/definitions/Erreur"
  /descripteurs:
    post:
      tags: [Descripteurs]
      summary: Renvoie les descripteurs d'une ou plusieurs images
      parameters:
        - in: body
          name: corps
          required: true
          schema:
            type: object
            required: [images]
            properties:
              images:
                type: array
                description: 1 à 100 images
                items:
                  type: object
                  required: [source, id]
                  properties:
                    source:
                      type: string
                      enum: [galerie, ghim]
                    id:
                      type: integer
                      example: 7
      responses:
        200:
          description: Une entrée par image, dans l'ordre demandé
          schema:
            type: array
            items:
              $ref: "#/definitions/Descripteurs"
        400:
          description: Liste absente, vide, trop longue ou mal écrite
          schema:
            $ref: "#/definitions/Erreur"
        404:
          description: Image introuvable
          schema:
            $ref: "#/definitions/Erreur"
  /ghim:
    get:
      tags: [GHIM-10K]
      summary: Liste les catégories, ou une page d'images d'une catégorie
      parameters:
        - in: query
          name: categorie
          type: string
          description: sans ce paramètre, la réponse est la liste des 20 catégories (nom, nb_images)
        - in: query
          name: page
          type: integer
          description: numéro de page, à partir de 1 (60 images par page)
      responses:
        200:
          description: Avec une catégorie, une page de ses images
          schema:
            type: object
            properties:
              images:
                type: array
                items:
                  $ref: "#/definitions/Resultat"
              page:
                type: integer
                example: 1
              pages:
                type: integer
                example: 9
              total:
                type: integer
                example: 500
        404:
          description: Catégorie introuvable
          schema:
            $ref: "#/definitions/Erreur"
        503:
          description: Index absent (lancer backend/indexer.py)
          schema:
            $ref: "#/definitions/Erreur"
  /ghim/{id}/fichier:
    get:
      tags: [GHIM-10K]
      summary: Renvoie le fichier d'une image de GHIM-10K
      produces: [image/jpeg]
      parameters:
        - in: path
          name: id
          type: integer
          required: true
      responses:
        200:
          description: Le fichier
          schema:
            type: file
        404:
          description: Image introuvable
          schema:
            $ref: "#/definitions/Erreur"
  /recherche:
    post:
      tags: [Recherche]
      summary: Renvoie la requête puis ses k images les plus proches
      description: |
        Les vecteurs sont centrés-réduits avec les statistiques de GHIM-10K.
        Distance (formule 1 du papier) : somme des carrés des écarts, divisée par 141.
        La requête sort elle-même en premier, avec une distance 0 ; les k images suivent (k + 1 lignes en tout).
      parameters:
        - in: body
          name: corps
          required: true
          schema:
            type: object
            required: [requete]
            properties:
              requete:
                $ref: "#/definitions/Designation"
              k:
                type: integer
                description: nombre de résultats, de 5 à 100 (20 par défaut)
                example: 20
      responses:
        200:
          description: Résultats classés par distance croissante
          schema:
            type: object
            properties:
              requete:
                $ref: "#/definitions/Resultat"
              resultats:
                type: array
                items:
                  $ref: "#/definitions/Resultat"
        400:
          description: Requête mal écrite ou k hors limites
          schema:
            $ref: "#/definitions/Erreur"
        404:
          description: Image requête introuvable
          schema:
            $ref: "#/definitions/Erreur"
        503:
          description: Index absent (lancer backend/indexer.py)
          schema:
            $ref: "#/definitions/Erreur"
  /images/zip:
    post:
      tags: [Images]
      summary: Renvoie plusieurs images dans une archive ZIP
      produces: [application/zip]
      parameters:
        - in: body
          name: corps
          required: true
          schema:
            $ref: "#/definitions/Ids"
      responses:
        200:
          description: Archive similis.zip
          schema:
            type: file
        400:
          description: Aucune image de la liste n'appartient à l'utilisateur
          schema:
            $ref: "#/definitions/Erreur"
  /images/suppression:
    post:
      tags: [Images]
      summary: Supprime plusieurs images
      parameters:
        - in: body
          name: corps
          required: true
          schema:
            $ref: "#/definitions/Ids"
      responses:
        200:
          description: Nombre d'images supprimées (les identifiants inconnus sont ignorés)
          schema:
            type: object
            properties:
              supprimees:
                type: integer
                example: 2
